name: Read-only journal recovery audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seal journal snapshot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: node blackjack/scripts/journal/audit-readonly.mjs collect journal-snapshot.enc
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-journal-snapshot
          path: journal-snapshot.enc
          retention-days: 1
