name: Guarded journal correction

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check the target row or apply its guarded correction
        required: true
        type: choice
        options:
          - check
          - apply

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify or correct one journal row
        env:
          CORRECTION_MODE: ${{ inputs.mode }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          JOURNAL_RESTORE_PAYLOAD: ${{ secrets.JOURNAL_RESTORE_PAYLOAD }}
        run: node .github/scripts/journal-correction.mjs
