# Build the CountLab blackjack trainer and deploy it to GitHub Pages (countlab.ca)
name: Deploy CountLab to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blackjack/package-lock.json
      - name: Build CountLab
        working-directory: blackjack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: "1.0.0"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_ANALYTICS_ENV: production
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: ${{ vars.NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT }}
          NEXT_PUBLIC_ANALYTICS_PERFORMANCE_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_ANALYTICS_PERFORMANCE_SAMPLE_RATE }}
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R blackjack/out/. _site/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
