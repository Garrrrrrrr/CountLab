name: Deploy analytics Edge Functions

on:
  push:
    branches: ["main"]
    paths:
      - "blackjack/supabase/functions/**"
      - "blackjack/supabase/config.toml"
      - ".github/workflows/deploy-analytics-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Deploy analytics ingestion
        working-directory: blackjack
        run: supabase functions deploy analytics --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy analytics alerts
        working-directory: blackjack
        run: supabase functions deploy analytics-alerts --project-ref "$SUPABASE_PROJECT_ID"
