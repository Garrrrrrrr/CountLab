name: Sync private casino directory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit counts or sync the encrypted private source
        required: true
        default: audit
        type: choice
        options: [audit, sync]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit or sync private directory
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DIRECTORY_SEED_KEY: ${{ secrets.DIRECTORY_SEED_KEY }}
        run: node blackjack/scripts/directory/sync-private-directory.mjs "${{ inputs.mode }}"
