# Temporary: repeats the reference-chart e2e specs on the CI browser to measure for three reference-chart e2e tests
# CI-only failures. Remove once they are fixed.
name: Diagnose reference e2e
on:
  push:
    branches: ["claude/eager-albattani-nsa253"]
    paths: [".github/workflows/diagnose-reference-e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackjack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blackjack/package-lock.json
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: "1.0.0"
          NEXT_PUBLIC_ANALYTICS_ENV: production
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run the three tests
        env:
          CI: "1"
        run: npx playwright test e2e/reference-charts.spec.ts e2e/strategy-chart.spec.ts --repeat-each=4 --reporter=line || true
