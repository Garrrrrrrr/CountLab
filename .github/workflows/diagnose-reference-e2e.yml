# Temporary: prints browser-side diagnostics for three reference-chart e2e tests
# that fail only on the CI browser. Remove once they are fixed.
name: Diagnose reference e2e
on:
  push:
    branches: ["claude/eager-albattani-nsa253"]
    paths: [".github/workflows/diagnose-reference-e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackjack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blackjack/package-lock.json
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: "1.0.0"
          NEXT_PUBLIC_ANALYTICS_ENV: production
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: "true"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Probe
        run: |
          (PORT=3100 node scripts/serve-export.mjs &) ; sleep 2
          cat > probe.mjs <<'EOF'
          import { chromium, devices } from "playwright";
          const b = await chromium.launch();
          console.log("browser", b.version());
          const init = () => { localStorage.setItem("countlab:analytics:consent_seen","1"); localStorage.setItem("countlab:analytics:consent","denied"); localStorage.setItem("countlab-install-dismissed","1"); localStorage.setItem("countlab:guest","1"); };
          const base = "http://127.0.0.1:3100";
          // 1. H17 cell colours as the contrast helper reads them.
          { const ctx = await b.newContext({ viewport: { width: 1440, height: 900 }, serviceWorkers: "block" }); const p = await ctx.newPage(); await p.addInitScript(init);
            p.on("console", (m) => m.type() === "error" && console.log("  console", m.text().slice(0, 200)));
            await p.goto(base + "/reference/h17-chart/");
            const cell = p.getByLabel("16 versus dealer 9: The chart prints 4+");
            for (const t of [0, 500, 2000]) { await p.waitForTimeout(t);
              console.log("H17 @" + t, await cell.evaluate((e) => { const out = []; for (let n = e; n; n = n.parentElement) { const s = getComputedStyle(n); out.push(`${n.tagName}.${String(n.className).slice(0, 40)} color=${s.color} bg=${s.backgroundColor} op=${s.opacity}`); } const c = document.createElement("canvas").getContext("2d"); c.fillStyle = "#123456"; c.fillStyle = getComputedStyle(e).color; out.push("canvas fillStyle(color) -> " + c.fillStyle); return out.slice(0, 8).join("\n    "); })); }
            await ctx.close(); }
          // 2. Rules panel groups at 320px.
          { const ctx = await b.newContext({ viewport: { width: 320, height: 568 }, serviceWorkers: "block" }); const p = await ctx.newPage(); await p.addInitScript(init);
            await p.goto(base + "/reference/"); await p.waitForTimeout(1500);
            await p.getByRole("button", { name: /^Table rules/ }).click(); await p.getByRole("button", { name: "More rules" }).click(); await p.waitForTimeout(300);
            console.log(await p.locator("#reference-rules fieldset").evaluateAll((gs) => gs.map((g) => { const o = g.querySelector(":scope > div:last-child"); return `${(g.textContent ?? "").slice(0, 40)} | scroll=${o.scrollWidth} client=${o.clientWidth} | ${[...o.children].map((c) => Math.round(c.getBoundingClientRect().width)).join(",")}`; }).join("\n")));
            await ctx.close(); }
          // 3. Duplicate cells on a phone.
          { const ctx = await b.newContext({ ...devices["iPhone 13"], serviceWorkers: "block" }); const p = await ctx.newPage(); await p.addInitScript(init);
            p.on("console", (m) => (m.type() === "error" || m.type() === "warning") && console.log("  console", m.text().slice(0, 300)));
            p.on("pageerror", (e) => console.log("  pageerror", e.message.slice(0, 300)));
            await p.goto(base + "/reference/?section=pairs&hand=2%2C2&dealer=5"); await p.waitForTimeout(1000);
            await p.goto(base + "/reference/deviations/?section=surrender&hand=15&dealer=A");
            for (let i = 0; i < 16; i++) { const info = await p.evaluate(() => [...document.querySelectorAll("[data-cell='surrender:15vA']")].map((e) => { const path = []; for (let a = e; a && path.length < 12; a = a.parentElement) path.push(a.tagName + (a.id ? "#" + a.id : "") + (a.dataset.testid ? "[" + a.dataset.testid + "]" : "") + (a.hidden ? "(hidden)" : "")); return path.join("<"); })); console.log("dup @" + i * 150, info.length, info.join(" || ")); await p.waitForTimeout(150); }
            await ctx.close(); }
          await b.close();
          EOF
          node probe.mjs
      - name: Run the three tests
        env:
          CI: "1"
        run: npx playwright test e2e/reference-charts.spec.ts e2e/strategy-chart.spec.ts -g "folded rules panel keeps|AA contrast in both|chart link opens" --repeat-each=3 --reporter=line || true
