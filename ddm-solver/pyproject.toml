[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddm-solver"
version = "0.1.0"
description = "Exact combinatorial solver and Monte Carlo engine for Double Down Madness blackjack"
requires-python = ">=3.9"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
mc = ["numba>=0.60"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
