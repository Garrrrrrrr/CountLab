      - paragraph
      - heading "Rules" [level=2] [ref=f14e224]
      - list [ref=f14e225]:
        - listitem [ref=f14e226]: The game uses six or eight ordinary 52-card decks.
        - listitem [ref=f14e227]: All cards have the same point value as in conventional blackjack.
        - listitem [ref=f14e228]: After a wager is made, the player shall receive one card and the dealer two cards. One dealer card shall be dealt face up and the other face down. The face down card is known as the “hole card.”
        - listitem [ref=f14e229]: If the dealer’s up card is an ace, the dealer shall offer insurance wagers. As in conventional blackjack, insurance bets shall win if the dealer’s hole card is any 10-point card. Winning insurance bets pay 2 to 1.
        - listitem [ref=f14e230]: If the dealer has a possible blackjack (10 or ace face up), then he shall peek at the hole card for a blackjack. If the dealer has a blackjack, then he shall expose it before the players have a chance to act. All players bets will lose against a dealer blackjack, including if the player has a 10 or ace.
        - listitem [ref=f14e231]: The player may start making decisions with only one card.
        - listitem [ref=f14e232]: If the player doubles with only an ace, he shall get one additional card only. Otherwise, the player may double at any time with any number of cards.
        - listitem [ref=f14e233]: After the player doubles, he may continue making decisions, including standing, hitting and re-doubling (except per rule 7).
        - listitem [ref=f14e234]: The player may double at any time. In other words, doubling is allowed on three or more cards. When re-doubling, the additional wager is always double the previous additional double down wager. For example, if the original wager was $10, the double down wagers would go $10 - $20 - $40 - $80 - etc.
        - listitem [ref=f14e235]: Splitting is not allowed.
        - listitem [ref=f14e236]: After all players have acted, the dealer shall draw to his hand. The dealer shall hit a soft 17.
        - listitem [ref=f14e237]: If the dealer draws to a total of 22, then all standing wagers shall push.
        - listitem [ref=f14e238]: Winning wagers, except a blackjack and insurance, pay even money.
        - listitem [ref=f14e239]:
          - text: The pay for a blackjack is configurable, according to casino management, as follows.
          - list [ref=f14e240]:
            - listitem [ref=f14e241]: " Version 1: Suited BJ pays 2-1, unsuited BJ pays 3-2."
            - listitem [ref=f14e242]: " Version 2: Suited BJ pays 3-2, unsuited BJ pays 3-2."
            - listitem [ref=f14e243]: " Version 3: Suited BJ pays 3-1, unsuited BJ pays 1-1."
        - listitem [ref=f14e244]: A "push 22" side bet is available. It pays 11 to 1 if the dealer draws to 22. The dealer will draw out his hand even if all players have busted.
      - paragraph [ref=f14e245]: The New York New York is using the version 1 rules.
      - heading "Strategy" [level=2] [ref=f14e246]
      - paragraph [ref=f14e247]: If the player has a 10-point card as his first card, he should always double.
      - paragraph [ref=f14e248]: If the player has an ace as his first card, he should always double, except with ace vs. ace in versions 2 and 3, he should hit.
      - paragraph [ref=f14e249]: Otherwise, with any hard total, the player should follow the following basic strategy table.
