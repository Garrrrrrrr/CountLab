<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · CountLab</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #101411;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 1.5rem;
  }
  .card { max-width: 26rem; }
  .icon {
    width: 3.5rem; height: 3.5rem; border-radius: 1rem;
    background: #a8ee72; color: #10200f;
    display: grid; place-items: center;
    font-size: 1.5rem; font-weight: 700;
    margin: 0 auto 1.25rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { color: #a1a1aa; line-height: 1.6; margin: 0 0 1.5rem; }
  button {
    min-height: 44px; padding: 0 1.25rem; border-radius: .75rem;
    background: #a8ee72; color: #10200f; font-weight: 600;
    border: none; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">♠</div>
    <h1>You're offline</h1>
    <p>This page needs a connection CountLab doesn't have right now. Pages you've already visited may still be available from the sidebar.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
