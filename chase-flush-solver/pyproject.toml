[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chase-flush-solver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<2.5", "numba>=0.66,<0.67", "scikit-learn>=1.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
